name: OpenLane GDS Flow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công từ tab Actions

jobs:
  build-gds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run OpenLane Flow
        run: |
          docker run --rm \
            -v $(pwd):/openlane \
            -e PDK_ROOT=/openlane/pdks \
            efabless/openlane:v1.0.2 \
            bash -c "./flow.tcl -design my_design"

      - name: Upload GDS File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-gds-output
          path: designs/my_design/runs/*/results/final/gds/*.gds
