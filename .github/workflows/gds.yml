name: OpenLane GDS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  build-gds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run OpenLane v1.0.2
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /openlane \
            efabless/efabless/openlane:superstable \
            ./flow.tcl -design_dir /workspace/openlane/top

      - name: Upload GDS Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gds-result
          path: openlane/top/runs/*/results/final/gds/*.gds
