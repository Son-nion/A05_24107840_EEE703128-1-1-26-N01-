
name: Generate GDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-22.04

    env:
      PDK: sky130A
      PDK_ROOT: /home/runner/pdk
      OPENLANE_ROOT: /home/runner/OpenLane
      OPENLANE_TAG: 2023.07.19-1

    steps:
      - name: Checkout design
        uses: actions/checkout@v4
      - name: Debug repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

          echo "Check required files:"
          for f in config.json src/A05_array_mult4x4.v constraints/design.sdc; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenLane
        run: |
          git clone --depth 1 \
            --branch "$OPENLANE_TAG" \
            https://github.com/The-OpenROAD-Project/OpenLane.git \
            "$OPENLANE_ROOT"

          cd "$OPENLANE_ROOT"
          grep -Rni --exclude-dir=.git \
           'install~=1.3.5' .
          grep -RIl --exclude-dir=.git \
           'install~=1.3.5' . |
           xargs -r sed -i \
           's/install~=1\.3\.5/pip-install~=1.3.5/g'
          
          make
          

      - name: Check design files
        run: |
          test -f config.json
          test -f src/A05_array_mult4x4.v
          test -f constraints/design.sdc
          python -m json.tool config.json > /dev/null

      - name: Run RTL to GDS
        run: |
          cd "$OPENLANE_ROOT"
          ./flow.tcl \
            -design "$GITHUB_WORKSPACE" \
            -tag github_run

      - name: Find GDS
        if: always()
        run: |
          find "$GITHUB_WORKSPACE/runs" \
            -type f -name "*.gds" -print 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A05-array-mult4x4-results
          path: runs/
          if-no-files-found: warn
