name: Verilog Simulation

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile Verilog
        run: |
          mkdir -p build
          iverilog -g2012 -o build/sim.out src/A05_array_mult4x4.v tb/A05_tb.v

      - name: Run simulation
        run: |
          cd build
          vvp sim.out
          test -n "$(find . -type f -name '*.vcd' -print -quit)"

      - name: Upload VCD
        uses: actions/upload-artifact@v4
        with:
          name: verilog-waveforms
          path: build/**/*.vcd
          if-no-files-found: error
          retention-days: 14
